# Alur deploy ini disusun sendiri agar game bisa dimainkan langsung dari browser.
name: deploy-play

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-play
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dossier (verify game files)
        run: |
          node --version
          MAKEFUN_OUTPUT_DIR=out node main.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - uses: actions/deploy-pages@v4
        continue-on-error: true
