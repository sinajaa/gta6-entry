<!doctype html>
<!-- Halaman host ini dirangkai sendiri oleh penulis entry untuk kanvas dan HUD. -->
<!-- index.html — halaman host kanvas game dan HUD -->
<html lang="en"><head><link rel="icon" href="data:,"><meta charset="utf-8"><title>Sunny City — Open-World Crime Sandbox</title><meta name="description" content="Sunny City is an offline 3D open-world crime game. Steal cars, outrun the police, run missions, and explore a living city — all in your browser."><meta name="theme-color" content="#1d1a17">
<style>html,body{margin:0;background:#1d1a17;height:100%;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#000}#stage canvas{position:absolute;inset:0;width:100%;height:100%}#hud{pointer-events:none}#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:1000;user-select:none;-webkit-user-select:none;touch-action:none}#touch.on{display:block}#touch>*{pointer-events:auto;touch-action:none}#stick{position:absolute;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45)}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}#tbtns{position:absolute;right:16px;bottom:16px;width:176px;display:grid;grid-template-columns:1fr 1fr;gap:10px;pointer-events:none}#tbtns button{pointer-events:auto;touch-action:none;height:60px;border-radius:30px;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.4);color:#fff;font:bold 15px sans-serif}#tbtns button.down{background:rgba(255,179,71,.7)}@media (max-width:900px){#touch{display:block}}</style>
</head><body><div id="stage"><canvas id="game" width="960" height="540"></canvas><canvas id="hud" width="960" height="540"></canvas></div>
<div id="touch"><div id="stick"><div id="knob"></div></div><div id="tbtns"><button data-btn="e">E</button><button data-btn="f">F</button><button data-btn="run">LARI</button><button data-btn="pause">PAUSE</button></div></div>
<script type="module" src="./src/main.js"></script></body></html>
