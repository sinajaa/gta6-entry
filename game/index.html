<!doctype html>
<!-- Halaman host ini dirangkai sendiri oleh penulis entry untuk kanvas dan HUD. -->
<!-- index.html — halaman host kanvas game dan HUD -->
<html lang="en"><head><link rel="icon" href="data:,"><meta charset="utf-8"><title>Sunny City — Open-World Crime Sandbox</title><meta name="description" content="Sunny City is an offline 3D open-world crime sandbox: steal cars, outrun the police, and chain story missions."><meta name="theme-color" content="#1d1a17">
<style>html,body{margin:0;background:#1d1a17;height:100%;display:flex;align-items:center;justify-content:center}#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#000}#stage canvas{position:absolute;inset:0;width:100%;height:100%}#hud{pointer-events:none}#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:1000;user-select:none;-webkit-user-select:none;touch-action:none}#touch.on{display:block}#touch>*{pointer-events:auto;touch-action:none}#stick{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45)}#ring{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);pointer-events:none}#knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}#tbtns{position:absolute;right:14px;bottom:14px;width:216px;display:grid;grid-template-columns:1fr 1fr;gap:12px;pointer-events:none}#tbtns button{pointer-events:auto;touch-action:none;height:72px;border-radius:36px;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.45);color:#fff;font:bold 16px sans-serif}#tbtns button.down{background:rgba(255,179,71,.75)}@media (max-width:900px){#touch{display:block}}</style>
</head><body><div id="stage"><canvas id="game" width="960" height="540"></canvas><canvas id="hud" width="960" height="540"></canvas></div>
<div id="touch"><div id="stick"><div id="ring"></div><div id="knob"></div></div><div id="tbtns"><button data-btn="e">E</button><button data-btn="brake">REM</button><button data-btn="f">F</button><button data-btn="run">LARI</button><button data-btn="pause">PAUSE</button></div></div>
<script type="module" src="./src/main.js"></script></body></html>
